<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>FRC Team 2064 - Panther Project</title>
  <!--
    The official 2064 mark. It only exists as raster art, so this is a 256px
    PNG embedded in an SVG wrapper rather than real paths: consumers keep one
    "@frc2064/ui/assets/favicon.svg" path and an image/svg+xml MIME type, and
    it stays crisp to 256px. Regenerate from the source art with:

      magick icon-512.png -trim +repage -resize 240x240 -background none \
        -gravity center -extent 256x256 -dither None -colors 128 -strip out.png

    then base64 the result into the href below. If the vector original ever
    turns up, replace this whole file with it - nothing else has to change.
  -->
  <image width="32" height="32" href="data:image/png;base64,"/>
</svg>
